name: Build for GD 2.2091 (Geode 6 alpha)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set target versions
        shell: bash
        run: |
          sed -i -e 's/"geode": "[^"]*"/"geode": "6.0.0-alpha.1"/' -e 's/2\.2081/2.2091/g' mod.json src/Solver.cpp
          grep -n '"geode"\|"win"' mod.json
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: nightly

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: PathSolver-v6
          path: ${{ steps.build.outputs.build-output }}
