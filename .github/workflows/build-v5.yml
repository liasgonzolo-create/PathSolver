name: Build for GD 2.2081 (Geode 5)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set target versions
        shell: bash
        run: |
          echo 'using mod.json as is'
          grep -n '"geode"\|"win"' mod.json
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: given

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: PathSolver-v5
          path: ${{ steps.build.outputs.build-output }}
